services:
  redis:
    image: redis:7

  worker:
    build: .
    command: python -m src.worker
    environment:
      - REDIS_HOST=redis
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  dashboard:
    build: .
    command: streamlit run src/dashboard.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - worker

  simulator:
    build: .
    command: python -m src.simulator --file data/realAWSCloudwatch/elb_request_count_8c0756.csv --rate 10 --limit 3000
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./data:/app/data
    depends_on:
      - worker